<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Proposal Pulse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2304211F'/%3E%3Cpath d='M4 17h6l3-7 5 13 3-6h7' fill='none' stroke='%2305BDBA' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --teal:#05BDBA; --teal-ink:#037a78; --pink:#F43F85; --amber:#E9A23B; --dark:#04211F;
  --bg:#F6F5F1; --panel:#FFFFFF; --ink:#04211F; --muted:#5B6B69; --line:#E3E1DA; --soft:#EEF8F7; --chip:#F0EEE8;
  --shadow:0 1px 2px rgba(4,33,31,.06),0 4px 16px rgba(4,33,31,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#031816; --panel:#06231F; --ink:#E7F2F0; --muted:#8FA8A5; --line:#123A35; --soft:#083330; --chip:#0B2E2A; --teal-ink:#3fd6d3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#031816; --panel:#06231F; --ink:#E7F2F0; --muted:#8FA8A5; --line:#123A35; --soft:#083330; --chip:#0B2E2A; --teal-ink:#3fd6d3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:var(--teal-ink)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:var(--dark);color:#E7F2F0;border-bottom:1px solid rgba(255,255,255,.06)}
header .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand svg{flex:none}
.brand small{font:500 11px "JetBrains Mono",monospace;color:#7fd9d6;letter-spacing:.06em;text-transform:uppercase;margin-left:4px}
.spacer{flex:1}
.hbtn{background:rgba(255,255,255,.08);color:#E7F2F0;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.14)}
select.hbtn{appearance:none;padding-right:10px}
select.hbtn option{color:#04211F}
.live{display:inline-flex;align-items:center;gap:6px;font:500 12px "JetBrains Mono",monospace;color:#9fe7e5}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(5,189,186,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(5,189,186,.55)}70%{box-shadow:0 0 0 8px rgba(5,189,186,0)}100%{box-shadow:0 0 0 0 rgba(5,189,186,0)}}
nav.tabs{display:flex;gap:4px;margin:20px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--teal)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hot .v{color:var(--pink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.feed{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:38px 1fr auto;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--soft);font-size:18px}
.ico.hot{background:rgba(244,63,133,.12)}
.ico.gate{background:var(--chip)}
.item .t1{font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.item .t1 .site{color:var(--ink);text-decoration:none}
.item .t1 .site:hover{text-decoration:underline}
.item .t2{color:var(--muted);font-size:13px;margin-top:2px}
.item .t3{font-size:13px;margin-top:6px;color:var(--ink)}
.when{font:500 12px "JetBrains Mono",monospace;color:var(--muted);text-align:right;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font:600 11px "JetBrains Mono",monospace;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);letter-spacing:.02em}
.badge.teal{background:rgba(5,189,186,.14);color:var(--teal-ink)}
.badge.pink{background:rgba(244,63,133,.13);color:var(--pink)}
.badge.amber{background:rgba(233,162,59,.16);color:#a86b12}
.badge.live{background:var(--teal);color:#04211F}
.who{font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--teal)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.meta b{color:var(--ink);font-weight:600}
details.more{margin-top:6px}
details.more summary{font-size:12.5px;color:var(--teal-ink);cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.clicks{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px}
.clicks li{padding:2px 0;color:var(--muted)}
.clicks li b{color:var(--ink);font-weight:500}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
th{font:600 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
td.num{font-family:"JetBrains Mono",monospace;font-size:13px}
.heat{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
input[type=text],input[type=password],input[type=search],select.in{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select.in:focus{outline:2px solid var(--teal);outline-offset:-1px}
.btn{background:var(--teal);color:#04211F;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--pink);border:1px solid rgba(244,63,133,.4)}
.btn:disabled{opacity:.5;cursor:default}
.drawer-bg{position:fixed;inset:0;background:rgba(4,33,31,.45);display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .2s ease;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer.on{transform:none}.drawer-bg.on{display:block}
.drawer .hd{position:sticky;top:0;background:var(--dark);color:#E7F2F0;padding:16px;display:flex;gap:10px;align-items:center}
.drawer .hd h3{margin:0;font-size:16px;flex:1;word-break:break-all}
.drawer .bd{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.grid2 .kpi{padding:10px 12px}.grid2 .kpi .v{font-size:20px}
.login{max-width:380px;margin:12vh auto;padding:28px}
.login h1{font-size:22px;margin:12px 0 4px;letter-spacing:-.02em}
.login p{color:var(--muted);margin:0 0 18px}
.login form{display:flex;flex-direction:column;gap:10px}
.err{color:var(--pink);font-size:13px;min-height:18px}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.status-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);gap:12px}
.status-row:first-child{border-top:0}
.status-row .k{font-weight:600}
.status-row .d{font-size:12.5px;color:var(--muted)}
.ok{color:var(--teal-ink);font-weight:600}.no{color:var(--pink);font-weight:600}
.sites-list{max-height:520px;overflow:auto}
.sites-list label{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:9px 14px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.sites-list label:hover{background:var(--soft)}
.sites-list .nm{font-weight:500;word-break:break-all}
.sites-list .sub{font-size:12px;color:var(--muted)}
.link-out{display:flex;gap:8px;margin-top:12px}
.link-out input{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#E7F2F0;padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;display:none;max-width:90vw}
.section-title{font:600 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{grid-column:span 2}.setup-grid{grid-template-columns:1fr}.grid2{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}th,td{padding:10px}}
@media (max-width:520px){.item{grid-template-columns:32px 1fr}.item .when{grid-column:2;text-align:left}.ico{width:32px;height:32px}.brand small{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer-bg" id="dbg"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var LOGO='<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#05BDBA" fill-opacity=".14"/><path d="M4 17h6l3-7 5 13 3-6h7" fill="none" stroke="#05BDBA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var S={key:'open',days:+(ls('pp_days')||30),tab:ls('pp_tab')||'activity',data:null,status:null,sites:null,q:'',siteFilter:'tracked',siteQ:'',sel:{}};
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},2600)}
function label(h){return String(h||'').replace(/\.netlify\.app$/,'')}
function dur(ms){var s=Math.round((ms||0)/1000);if(s<60)return s+'s';var m=Math.floor(s/60),r=s%60;if(m<60)return r?m+'m '+r+'s':m+'m';return Math.floor(m/60)+'h '+(m%60)+'m'}
function ago(t){var s=Math.round((Date.now()-t)/1000);if(s<45)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';if(s<86400*7)return Math.round(s/86400)+'d ago';return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function stamp(t){return new Date(t).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'x-pulse-key':S.key,'content-type':'application/json'},opt.headers||{});return fetch(path,opt).then(function(r){if(r.status===401){var last=+(ss('pp_401')||0);if(Date.now()-last>60000){ss('pp_401',String(Date.now()));location.reload()}else{S.key='';$('app').innerHTML='<div class="panel login">'+LOGO+'<h1>Proposal Pulse</h1><p>You are signed in, but the dashboard API said you are not authorized (401). Sign in to Netlify again, then reload.</p></div>'}throw new Error('unauthorized')}ss('pp_401',null);return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j})})}
function logout(){location.reload()}

// ---------- aggregation ----------
function hotOf(s){return (s.clicks||[]).filter(function(c){return c.hot})}
function bySite(){
  var m={};
  (S.data.tracked||[]).forEach(function(t){m[t.host]={host:t.host,name:t.name,url:t.url,tracked:true,sessions:[],vids:{},last:0,engaged:0,maxScroll:0,hot:0,gateOnly:0,wrong:0,recips:{}}});
  S.data.sessions.forEach(function(s){
    var x=m[s.host]||(m[s.host]={host:s.host,name:label(s.host),url:'https://'+s.host,tracked:false,sessions:[],vids:{},last:0,engaged:0,maxScroll:0,hot:0,gateOnly:0,wrong:0,recips:{}});
    x.sessions.push(s);
    if(s.unlocked&&s.human){x.vids[s.vid]=1;x.last=Math.max(x.last,s.last);x.engaged+=s.engagedMs;x.maxScroll=Math.max(x.maxScroll,s.maxScroll);x.hot+=hotOf(s).length;if(s.r)x.recips[s.r]=1}
    else if(s.gate&&!s.unlocked){x.gateOnly++}
    x.wrong+=s.wrongPw||0;
  });
  return Object.keys(m).map(function(k){var x=m[k];x.people=Object.keys(x.vids).length;x.visits=x.sessions.filter(function(s){return s.unlocked&&s.human}).length;x.score=heat(x);return x});
}
function heat(x){if(!x.visits)return 0;var sc=Math.min(40,x.engaged/1000/60*8)+Math.min(20,x.maxScroll/5)+x.hot*30+Math.min(20,(x.people-1)*10)+Math.min(10,(x.visits-1)*4);var rec=(Date.now()-x.last)/86400000;if(rec>14)sc*=.5;return Math.round(Math.min(100,sc))}
function heatColor(v){return v>=60?'var(--pink)':v>=30?'var(--amber)':v>0?'var(--teal)':'var(--line)'}

// ---------- rendering ----------
function render(){
  var app=$('app');
  if(!S.key){app.innerHTML=loginView();bindLogin();return}
  app.innerHTML=shell();
  bindShell();
  if(!S.data){load();return}
  body();
}
function loginView(){return '<div class="panel login">'+LOGO+'<h1>Proposal Pulse</h1><p>See who opens your proposal sites, what they read and when to follow up.</p><form id="lf"><input type="password" id="lp" placeholder="Dashboard password" autocomplete="current-password" autofocus><button class="btn" type="submit">Unlock</button><div class="err" id="le"></div></form></div>'}
function bindLogin(){$('lf').onsubmit=function(e){e.preventDefault();S.key=$('lp').value.trim();fetch('/api/data?days=1',{headers:{'x-pulse-key':S.key}}).then(function(r){if(r.status===401){$('le').textContent='Wrong password';S.key='';return}ls('pp_key',S.key);render()}).catch(function(){$('le').textContent='Could not reach the server'})}}
function shell(){
  return '<header><div class="wrap"><div class="brand">'+LOGO+'<span>Proposal Pulse</span></div><div class="spacer"></div>'+
  '<span class="live hide-sm"><span class="dot"></span><span id="upd">live</span></span>'+
  '<select class="hbtn" id="days" aria-label="Date range">'+[7,30,90,180].map(function(d){return '<option value="'+d+'"'+(d===S.days?' selected':'')+'>Last '+d+' days</option>'}).join('')+'</select>'+
  '<button class="hbtn" id="rf" title="Refresh">Refresh</button></div></header>'+
  '<main class="wrap"><div id="kpis"></div><nav class="tabs">'+
  [['activity','Activity'],['proposals','Proposals'],['links','Link builder'],['setup','Setup']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+
  '</nav><div id="body"><div class="panel empty">Loading…</div></div><div style="height:40px"></div></main>';
}
function bindShell(){
  $('days').onchange=function(){S.days=+this.value;ls('pp_days',String(S.days));S.data=null;load()};
  $('rf').onclick=function(){load(true)};
  document.querySelectorAll('nav.tabs button').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;ls('pp_tab',S.tab);document.querySelectorAll('nav.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});body()}});
}
function load(manual){
  return api('/api/data?days='+S.days).then(function(d){S.data=d;if(manual)toast('Updated');$('upd')&&($('upd').textContent='updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));kpis();var busy=document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||document.querySelector('#body details[open]');if(!$('body').dataset.ready||(!busy&&S.tab!=='setup'&&S.tab!=='links'))body();if(!$('drawer').classList.contains('on'))openFromHash()}).catch(function(e){if(e.message!=='unauthorized')$('body').innerHTML='<div class="panel empty">Could not load data: '+esc(e.message)+'</div>'});
}
function kpis(){
  var sites=bySite(),now=Date.now();
  var opened=sites.filter(function(x){return x.visits>0});
  var live=S.data.sessions.filter(function(s){return s.unlocked&&now-s.last<75000});
  var hot=S.data.sessions.reduce(function(a,s){return a+hotOf(s).length},0);
  var human=S.data.sessions.filter(function(s){return s.unlocked&&s.human});
  var avg=human.length?human.reduce(function(a,s){return a+s.engagedMs},0)/human.length:0;
  $('kpis').innerHTML='<div class="kpis">'+
   k('Tracked',(S.data.tracked||[]).length,'proposal sites')+
   k('Opened',opened.length,'in last '+S.days+' days')+
   k('Live now',live.length,live.length?esc(label(live[0].host)):'nobody right now')+
   k('Booking clicks',hot,'calendar / email links',hot?'hot':'')+
   k('Avg read',dur(avg),human.length+' visits')+'</div>';
  function k(l,v,s,c){return '<div class="kpi '+(c||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>'}
}
function body(){
  var b=$('body');b.dataset.ready='1';
  if(S.tab==='activity')return activity(b);
  if(S.tab==='proposals')return proposals(b);
  if(S.tab==='links')return links(b);
  if(S.tab==='setup')return setup(b);
}

function sessionCard(s,withSite){
  var now=Date.now(),hot=hotOf(s),isLive=s.unlocked&&now-s.last<75000;
  var icon='👀',cls='',title='Opened';
  if(!s.unlocked){icon='🔒';cls='gate';title=s.wrongPw?'Tried the password':'Reached the password page'}
  else if(hot.length){icon='🔥';cls='hot';title='Clicked '+(/^mailto:/i.test(hot[0].href||'')?'your email link':'your booking link')}
  else if(s.engagedMs>=120000){icon='📖';title='Deep read'}
  else if(!s.human){icon='·';cls='gate';title='Brief visit (no interaction)'}
  var badges=[];
  if(isLive)badges.push('<span class="badge live">LIVE</span>');
  if(s.alerts&&s.alerts.indexOf('open')>-1){if(s.newVisitor&&s.visitorCount>1)badges.push('<span class="badge amber">new person · '+s.visitorCount+' total</span>');else if(s.visitNo>1)badges.push('<span class="badge teal">visit #'+s.visitNo+'</span>')}
  if(s.wrongPw)badges.push('<span class="badge pink">wrong password ×'+s.wrongPw+'</span>');
  var where=[s.city,s.cc].filter(Boolean).join(', ')||'Unknown location';
  var h='<div class="item"><div class="ico '+cls+'">'+icon+'</div><div><div class="t1">'+esc(title)+(withSite?' · <a class="site" href="#site='+encodeURIComponent(s.host)+'">'+esc(label(s.host))+'</a>':'')+' '+badges.join(' ')+'</div>'+
  '<div class="t2"><span class="who">'+(s.r?esc(s.r):'Unknown recipient')+'</span> · '+esc(where)+' · '+esc(s.device+' · '+s.browser+'/'+s.os)+(s.ref?' · via '+esc(s.ref):'')+'</div>';
  if(s.unlocked){
    h+='<div class="meta"><span>Read <b>'+dur(s.engagedMs)+'</b></span><span>Scrolled <span class="bar"><i style="width:'+(s.maxScroll||0)+'%"></i></span> <b>'+(s.maxScroll||0)+'%</b></span><span>Clicks <b>'+(s.clicks||[]).length+'</b></span>'+(s.paths&&s.paths.length>1?'<span>Pages <b>'+s.paths.length+'</b></span>':'')+'</div>';
    if((s.sections&&s.sections.length)||(s.clicks&&s.clicks.length)){
      h+='<details class="more"><summary>Sections read &amp; clicks ›</summary>';
      if(s.sections&&s.sections.length)h+='<div class="t3"><b>Read:</b> '+s.sections.map(esc).join(' → ')+'</div>';
      if(s.clicks&&s.clicks.length)h+='<ul class="clicks">'+s.clicks.map(function(c){return '<li>'+(c.hot?'🔥 ':'')+'<b>'+esc(c.label||c.href||'(click)')+'</b>'+(c.href?' <span class="mono">'+esc(c.href.replace(/^https?:\/\//,'').slice(0,60))+'</span>':'')+' · '+new Date(c.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</li>'}).join('')+'</ul>';
      h+='</details>';
    }
  }
  h+='</div><div class="when" title="'+esc(stamp(s.start))+'">'+ago(s.last)+'<br><span class="hide-sm">'+new Date(s.start).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span></div></div>';
  return h;
}
function activity(b){
  var list=S.data.sessions.filter(function(s){return s.unlocked||s.gate});
  var showAll=S.showBrief;
  var vis=list.filter(function(s){return showAll||s.human||(!s.unlocked&&s.gate)});
  var hidden=list.length-vis.length;
  b.innerHTML='<div class="panel"><div class="toolbar"><input type="search" id="aq" placeholder="Filter by site or recipient" value="'+esc(S.q)+'" style="flex:1;min-width:160px">'+
  (hidden||showAll?'<label class="hint"><input type="checkbox" id="brief" '+(showAll?'checked':'')+'> show brief visits ('+(showAll?list.filter(function(s){return s.unlocked&&!s.human}).length:hidden)+')</label>':'')+'</div><div class="feed" id="feed"></div></div>';
  function draw(){var q=S.q.toLowerCase();var f=vis.filter(function(s){return !q||s.host.indexOf(q)>-1||(s.r||'').toLowerCase().indexOf(q)>-1}).slice(0,200);
    $('feed').innerHTML=f.length?f.map(function(s){return sessionCard(s,true)}).join(''):'<div class="empty">'+(S.data.sessions.length?'No matching activity.':'No activity yet. Once the tracker is on your sites, opens will show up here within seconds.')+'</div>'}
  draw();
  $('aq').oninput=function(){S.q=this.value;draw()};
  if($('brief'))$('brief').onchange=function(){S.showBrief=this.checked;activity(b)};
}
function proposals(b){
  var sites=bySite().sort(function(a,b){return (b.last-a.last)||(a.name<b.name?-1:1)});
  b.innerHTML='<div class="panel"><div class="toolbar"><input type="search" id="pq" placeholder="Search proposals" value="'+esc(S.q)+'" style="flex:1;min-width:160px"><span class="hint">Heat = read time + scroll + booking clicks + people + return visits</span></div><div style="overflow-x:auto"><table><thead><tr><th>Proposal</th><th>Last opened</th><th class="hide-sm">People</th><th class="hide-sm">Visits</th><th>Read time</th><th class="hide-sm">Scroll</th><th>🔥</th></tr></thead><tbody id="pt"></tbody></table></div></div>';
  function draw(){var q=S.q.toLowerCase();var f=sites.filter(function(x){return !q||x.host.indexOf(q)>-1||x.name.toLowerCase().indexOf(q)>-1||Object.keys(x.recips).join(' ').toLowerCase().indexOf(q)>-1});
    $('pt').innerHTML=f.length?f.map(function(x){return '<tr data-host="'+esc(x.host)+'"><td><span class="heat" style="background:'+heatColor(x.score)+'" title="Heat '+x.score+'"></span><b>'+esc(label(x.host))+'</b>'+(Object.keys(x.recips).length?'<div class="hint" style="margin-left:18px">'+esc(Object.keys(x.recips).slice(0,4).join(', '))+'</div>':'')+(x.gateOnly&&!x.visits?'<div class="hint" style="margin-left:18px">🔒 reached password page ×'+x.gateOnly+'</div>':'')+'</td><td class="num">'+(x.last?ago(x.last):'<span class="hint">not yet</span>')+'</td><td class="num hide-sm">'+(x.people||'–')+'</td><td class="num hide-sm">'+(x.visits||'–')+'</td><td class="num">'+(x.engaged?dur(x.engaged):'–')+'</td><td class="num hide-sm">'+(x.visits?x.maxScroll+'%':'–')+'</td><td class="num">'+(x.hot||'')+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No proposals tracked yet. Go to Setup to add the tracker to your sites.</td></tr>';
    document.querySelectorAll('#pt tr[data-host]').forEach(function(tr){tr.onclick=function(){location.hash='site='+encodeURIComponent(tr.dataset.host)}})}
  draw();$('pq').oninput=function(){S.q=this.value;draw()};
}
function openFromHash(){var m=/site=([^&]+)/.exec(location.hash);if(m&&S.data)drawer(decodeURIComponent(m[1]));else closeDrawer(true)}
window.addEventListener('hashchange',openFromHash);
function closeDrawer(silent){$('drawer').classList.remove('on');$('dbg').classList.remove('on');$('drawer').setAttribute('aria-hidden','true');if(!silent&&/site=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search)}
$('dbg').onclick=function(){closeDrawer()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});
function drawer(host){
  var x=bySite().filter(function(s){return s.host===host})[0];
  var d=$('drawer');
  if(!x){x={host:host,name:label(host),url:'https://'+host,sessions:[],people:0,visits:0,engaged:0,maxScroll:0,hot:0,recips:{}}}
  var secCount={};x.sessions.forEach(function(s){(s.sections||[]).forEach(function(l){secCount[l]=(secCount[l]||0)+1})});
  var secs=Object.keys(secCount).sort(function(a,b){return secCount[b]-secCount[a]});
  d.innerHTML='<div class="hd"><h3>'+esc(label(host))+'</h3><a class="hbtn" href="https://'+esc(host)+'" target="_blank" rel="noopener">Open site ↗</a><button class="hbtn" id="dx" aria-label="Close">✕</button></div><div class="bd">'+
  '<div class="grid2"><div class="kpi"><div class="l">People</div><div class="v">'+x.people+'</div></div><div class="kpi"><div class="l">Visits</div><div class="v">'+x.visits+'</div></div><div class="kpi"><div class="l">Read time</div><div class="v">'+dur(x.engaged)+'</div></div><div class="kpi '+(x.hot?'hot':'')+'"><div class="l">Booking clicks</div><div class="v">'+x.hot+'</div></div></div>'+
  (secs.length?'<div class="section-title">Most-read sections</div><div class="panel" style="padding:10px 14px">'+secs.slice(0,12).map(function(l){return '<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0"><span>'+esc(l)+'</span><span class="mono hint">'+secCount[l]+'×</span></div>'}).join('')+'</div>':'')+
  '<div class="section-title">Visit timeline</div><div class="panel feed">'+(x.sessions.length?x.sessions.slice().sort(function(a,b){return b.last-a.last}).map(function(s){return sessionCard(s,false)}).join(''):'<div class="empty">No visits yet.</div>')+'</div>'+
  '<div class="section-title">Personal link</div><div class="panel" style="padding:14px">'+linkForm(host)+'</div></div>';
  $('dx').onclick=function(){closeDrawer()};
  bindLinkForm();
  d.classList.add('on');$('dbg').classList.add('on');d.setAttribute('aria-hidden','false');d.scrollTop=0;
}
function slug(s){return s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)}
function linkForm(host){
  var opts=(S.data.tracked||[]).map(function(t){return t.host}).concat(host?[host]:[]).filter(function(v,i,a){return v&&a.indexOf(v)===i}).sort();
  return '<div style="display:flex;gap:8px;flex-wrap:wrap"><select class="in" id="lsite" style="flex:1;min-width:200px">'+(opts.length?opts.map(function(h){return '<option'+(h===host?' selected':'')+' value="'+esc(h)+'">'+esc(label(h))+'</option>'}).join(''):'<option value="">No tracked sites yet</option>')+'</select><input type="text" id="lwho" placeholder="Recipient, e.g. Jane Smith CTO" style="flex:1;min-width:200px"></div><div class="link-out"><input type="text" id="lout" readonly class="mono" placeholder="Personal link appears here"><button class="btn" id="lcopy">Copy</button></div><p class="hint" style="margin:10px 0 0">Send each person their own link so alerts say who opened it. The site password stays the same, and the name is never shown on the page.</p>';
}
function bindLinkForm(){
  function upd(){var h=$('lsite').value,w=slug($('lwho').value);$('lout').value=h?('https://'+h+'/'+(w?'?r='+w:'')):''}
  $('lsite').onchange=upd;$('lwho').oninput=upd;upd();
  $('lcopy').onclick=function(){var v=$('lout').value;if(!v)return;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('Link copied')}).catch(function(){$('lout').select();document.execCommand('copy');toast('Link copied')})};
}
function links(b){
  b.innerHTML='<div class="panel" style="padding:18px"><h3 style="margin:0 0 4px">Personal links</h3><p class="hint" style="margin:0 0 14px">Add <span class="mono">?r=name</span> to a proposal link and every alert and visit will be labelled with that person, so you can tell forwards apart.</p>'+linkForm('')+'</div>';
  bindLinkForm();
}

// ---------- setup ----------
function setup(b){
  b.innerHTML='<div class="setup-grid"><div class="panel" id="st"><div class="empty">Checking setup…</div></div><div class="panel" style="padding:16px"><h3 style="margin:0 0 6px">How it works</h3><ol class="hint" style="margin:0;padding-left:18px;line-height:1.7"><li>Netlify organization webhooks tell the collector when a project is created or published. Projects in your configured teams get a ~3 KB tracker through Netlify Snippet Injection, live instantly with no redeploy.</li><li>Existing projects pick up the tracker on their next production deploy, or right away with Track.</li><li>The tracker records opens, password-page hits, read time, scroll depth, sections read and clicks. It sets no cookies and stores no IP addresses.</li><li>Optional Slack alerts from the collector: first open, return visit, new person (possible forward), booking-link click and 2+ minute read.</li><li>Untrack a project to remove the tracker. It stays untracked on later deploys.</li></ol></div></div>'+
  '<div class="panel" id="hookp" style="margin-bottom:16px"><div class="empty">Checking org webhook…</div></div>'+
  '<div class="panel"><div class="toolbar"><b style="margin-right:auto">Projects</b><select class="in" id="sf"><option value="tracked">Tracked</option><option value="excluded">Untracked</option><option value="all">All</option></select><input type="search" id="sq" placeholder="Search" value="'+esc(S.siteQ)+'"><button class="btn ghost" id="sall">Select shown</button><input type="text" id="tref" placeholder="Project name or URL" class="mono" style="width:200px"><button class="btn" id="strackone">Track</button><button class="btn danger" id="suntrack" disabled>Untrack</button><button class="btn ghost" id="sforget" disabled title="Remove from Proposal Pulse without calling Netlify, e.g. for deleted projects">Forget</button></div><div class="sites-list" id="sl"><div class="empty">Loading projects…</div></div></div>';
  $('sf').value=S.siteFilter;
  api('/api/admin?op=status').then(function(st){S.status=st;
    $('st').innerHTML=
    row('Database',st.db?'<span class="ok">Connected</span>':'<span class="no">Error</span>',st.db?st.trackedCount+' tracked · '+st.excludedCount+' untracked':esc(st.dbError))+
    row('Collector',st.collector?'<span class="ok">Connected</span>':'<span class="no">Error</span>',st.collector?'<span class="mono">'+esc(st.collectorUrl.replace(/^https?:\/\//,''))+'</span>':esc(st.collectorError))+
    (st.collector?row('Netlify token',st.me&&!st.tokenError?'<span class="ok">Connected</span>':'<span class="no">Error</span>',st.me?'as '+esc(st.me.name||st.me.email)+' (set on the collector)':esc(st.tokenError||'NETLIFY_TOKEN is not set on the collector'))+
    row('Teams',st.teams.length?'<span class="ok">'+st.teams.length+'</span>':'<span class="no">None</span>',st.teams.length?'<span class="mono">'+esc(st.teams.join(', '))+'</span>':'Set PULSE_TEAMS on the collector, then redeploy')+
    row('Slack alerts',st.slack==='paused'?'<span class="no">Paused</span>':st.slack==='none'?'<span class="no">Off</span>':'<span class="ok">On</span>',st.slack==='paused'?'SLACK_ALERTS=off is set on the collector':st.slack==='none'?'Optional: set SLACK_WEBHOOK_URL on the collector':'via '+(st.slack==='workflow'?'Workflow Builder webhook':'Incoming Webhook')):'');
  }).catch(function(e){$('st').innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
  api('/api/admin?op=hook-status').then(function(h){
    var last=h.recent&&h.recent[0];var n=h.last24h||{};
    var counts=Object.keys(n).map(function(k){return esc(k)+' '+n[k]}).join(' · ');
    $('hookp').innerHTML='<div class="status-row"><div><div class="k">Org webhook</div><div class="d">'+
      (last?'Last event '+ago(last.at)+': '+esc(last.event)+' · '+esc(last.site_name||last.site_id||'')+' → '+esc(last.outcome)+(counts?'<br>Last 24h: '+counts:''):
       'No deliveries yet. An Organization Owner subscribes the org webhooks once (README, step 8).')+
      '</div></div><div>'+(last?'<span class="ok">Receiving</span>':'<span class="no">Waiting</span>')+'</div></div>'+
      (h.recent&&h.recent.length?'<details style="padding:0 14px 10px"><summary class="hint" style="cursor:pointer">Recent deliveries</summary><div style="overflow-x:auto"><table><tbody>'+h.recent.map(function(r){return '<tr><td class="num">'+ago(r.at)+'</td><td>'+esc(r.event)+'</td><td>'+esc(r.site_name||r.site_id||'')+'</td><td>'+esc(r.team||'')+'</td><td><b>'+esc(r.outcome)+'</b> <span class="hint">'+esc(r.detail||'')+'</span></td></tr>'}).join('')+'</tbody></table></div></details>':'');
  }).catch(function(e){$('hookp').innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
  function row(k,v,d){return '<div class="status-row"><div><div class="k">'+k+'</div><div class="d">'+d+'</div></div><div>'+v+'</div></div>'}
  $('sf').onchange=function(){S.siteFilter=this.value;drawSites()};
  $('sq').oninput=function(){S.siteQ=this.value;drawSites()};
  $('sall').onclick=function(){shown().forEach(function(s){S.sel[s.id]=1});drawSites()};
  function bulk(op,verb,confirmText){var ids=Object.keys(S.sel).filter(function(k){return S.sel[k]});if(!ids.length)return;if(!confirm(confirmText.replace('%n',ids.length)))return;
    api('/api/admin?op='+op,{method:'POST',body:JSON.stringify({ids:ids})}).then(function(r){var ok=r.results.filter(function(x){return x.ok}).length,bad=r.results.length-ok;toast(verb+' '+ok+' project'+(ok===1?'':'s')+(bad?' · '+bad+' failed':''));S.sel={};S.data=null;load();loadSites()}).catch(function(e){toast(e.message)})}
  $('strackone').onclick=function(){var v=$('tref').value.trim();if(!v)return toast('Enter a project name or URL');var btn=this;btn.disabled=true;
    api('/api/admin?op=track',{method:'POST',body:JSON.stringify({refs:v.split(/[\s,]+/)})}).then(function(r){toast(r.results.map(function(x){return x.ok?'Tracking '+x.name:x.ref+': '+x.error}).join(' · '));$('tref').value='';S.data=null;load();loadSites()}).catch(function(e){toast(e.message)}).finally(function(){btn.disabled=false})};
  $('suntrack').onclick=function(){bulk('untrack','Untracked','Remove the tracker from %n project(s)? They stay untracked on later deploys. Past visits are kept.')};
  $('sforget').onclick=function(){bulk('forget','Forgot','Forget %n project(s)? This only removes them from Proposal Pulse and does not touch Netlify. Use it for deleted projects.')};
  loadSites();
}
function loadSites(){api('/api/admin?op=sites').then(function(r){S.sites=r.sites;drawSites()}).catch(function(e){$('sl')&&($('sl').innerHTML='<div class="empty">'+esc(e.message)+'</div>')})}
function shown(){if(!S.sites)return[];var q=S.siteQ.toLowerCase();return S.sites.filter(function(s){return (S.siteFilter==='all'||s.status===S.siteFilter)&&(!q||s.name.toLowerCase().indexOf(q)>-1||(s.team||'').toLowerCase().indexOf(q)>-1)})}
function drawSites(){
  if(!S.sites||!$('sl'))return;
  var f=shown();
  $('sl').innerHTML=f.length?f.map(function(s){return '<label><input type="checkbox" data-id="'+esc(s.id)+'" '+(S.sel[s.id]?'checked':'')+'><div><div class="nm">'+esc(s.name)+'</div><div class="sub">'+esc(s.team)+(s.trackedAt?' · tracked '+new Date(s.trackedAt).toLocaleDateString():'')+(s.via?' · via '+esc(s.via):'')+'</div></div><div>'+(s.status==='tracked'?'<span class="badge teal">tracking</span>':'<span class="badge">untracked</span>')+'</div></label>'}).join(''):'<div class="empty">'+(S.siteFilter==='tracked'?'No tracked projects yet. New projects appear here when they are created or next deployed.':'No projects match.')+'</div>';
  $('sl').querySelectorAll('input[type=checkbox]').forEach(function(c){c.onchange=function(){S.sel[c.dataset.id]=c.checked?1:0;btns()}});
  btns();
  function btns(){var n=Object.keys(S.sel).filter(function(k){return S.sel[k]}).length;$('suntrack').disabled=!n;$('sforget').disabled=!n}
}

setInterval(function(){if(S.key&&document.visibilityState==='visible'&&S.tab!=='setup')load()},30000);
render();
})();
</script>
</body>
</html>
